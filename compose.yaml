name: agentos-development
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agentos
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a dedicated password in .env}
    ports:
      - "127.0.0.1:15482:5432"
    volumes:
      - agentos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
volumes:
  agentos-postgres:
